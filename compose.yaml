services:
  energytool:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - energytool_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  energytool_data:
